name: Deploy to cPanel via FTP
# Auto-deploy-on-push disabled during the bongshaihousing.com cutover to the
# Node app - a push to main mid-cutover would overwrite public_html with
# stale static files and race the new app. Re-add the `push:` trigger below
# once the cutover is confirmed stable, or run this manually via
# workflow_dispatch in the meantime if a static-only fix is truly needed.
on:
  workflow_dispatch: {}

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v3

    - name: 📂 Sync files
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        server-dir: public_html/bongshaihousing.com/
        exclude: |
          **/.git*
          **/.git*/**
          **/.github/**
