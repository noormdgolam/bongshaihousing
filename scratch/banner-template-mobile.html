<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 2338px; overflow: hidden; font-family: Georgia, 'Times New Roman', serif; }

  .banner {
    position: relative;
    width: 1080px;
    height: 2338px;
    background: #0f172a;
  }

  .title-band {
    height: 320px;
    background: #0f172a;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding: 0 60px 40px;
    border-bottom: 3px solid #EAB308;
  }

  .title-band h1 {
    font-size: 62px;
    font-weight: 700;
    letter-spacing: 0.01em;
    color: #FDE047;
    text-transform: uppercase;
    text-align: center;
    line-height: 1.2;
  }

  .photo-area {
    height: 1680px;
    background: #0f172a;
    padding: 16px;
  }

  .photo-area > div {
    width: 100%;
    height: 100%;
    overflow: hidden;
    border: 6px solid #ffffff;
    background: #ffffff;
    box-shadow: 0 4px 14px rgba(0,0,0,0.18);
  }

  .photo-area img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    object-position: center 15%;
    display: block;
  }

  .button-footer {
    height: 338px;
    background: #0f172a;
  }
</style>
</head>
<body>
  <div class="banner">
    <div class="title-band"><h1>Apartment Building</h1></div>
    <div class="photo-area"><div><img src="banner-assets/apt-1.jpeg" alt=""></div></div>
    <div class="button-footer"></div>
  </div>
</body>
</html>
